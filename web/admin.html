<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙虾脑 · 运营看板</title>
<style>
:root { --bg:#f5f7fb; --card:#fff; --line:#e5eaf2; --text:#1c2b43; --muted:#65758b; --blue:#1769e0; --green:#18794e; --red:#c13939; --yellow:#946200; --gray:#95a2b3}

* { box-sizing:border-box; margin:0; padding:0}
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; line-height:1.6}
button,input { font:inherit}
button,a,input { -webkit-tap-highlight-color:transparent}
button { cursor:pointer}
button:disabled { opacity:.55; cursor:wait}
button:focus-visible,a:focus-visible,input:focus-visible { outline:3px solid #8bbcff; outline-offset:3px}
a { color:var(--blue); text-decoration:none}
a:hover { text-decoration:underline}
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--gray); flex-shrink:0}
.dot.online,.dot.on { background:var(--green)}
.badge,.st { display:inline-block; white-space:nowrap; border-radius:6px; padding:3px 9px; font-size:12px; font-weight:600; background:#edf1f6; color:var(--muted)}
.badge.queued,.st.queued { background:#edf1f6; color:#53647a}
.badge.dispatched,.st.dispatched { background:#eaf2ff; color:#1761c5}
.badge.running,.st.running { background:#fff4d9; color:var(--yellow)}
.badge.success,.st.success { background:#e9f6ef; color:var(--green)}
.badge.failed,.st.failed { background:#fff0f0; color:var(--red)}
.eyebrow { color:var(--blue); font-size:11px; font-weight:700; letter-spacing:2px; margin-bottom:6px}
.page-note { font-size:12px; color:var(--muted)}
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important}
}


body { max-width:1200px; margin:auto; padding:32px 32px 48px}
.topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:32px}
.brand { font-size:18px; font-weight:700}
.topbar a { font-size:13px; background:white; border:1px solid var(--line); border-radius:9px; padding:10px 14px; min-height:44px}
h1 { font-size:28px; letter-spacing:-.8px; margin-bottom:6px}
.sub { font-size:13px; color:var(--muted); line-height:1.8}
.overview { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px}
.devline { font-size:12px; color:var(--muted); background:white; border:1px solid var(--line); padding:9px 14px; border-radius:20px}
.devline .dot { margin-right:7px}
.kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:24px}
.kpi { background:white; border:1px solid var(--line); border-radius:16px; padding:22px 24px; display:flex; flex-direction:column-reverse; gap:10px}
.kpi .v { font-size:34px; line-height:1.3; font-weight:650; letter-spacing:-1px; font-variant-numeric:tabular-nums}
.kpi:first-child .v { color:var(--blue)}
.kpi .k { font-size:12px; color:var(--muted)}
.grid2 { display:grid; grid-template-columns:1.15fr 1fr; gap:20px; margin-bottom:24px}
.panel { background:white; border:1px solid var(--line); border-radius:16px; padding:24px; min-width:0}
.panel h2 { font-size:15px; margin-bottom:20px}
.bar-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:12px}
.bar-row .name { width:78px; color:var(--muted); overflow-wrap:anywhere}
.bar-track { flex:1; height:8px; background:#edf2f8; border-radius:8px; overflow:hidden}
.bar-fill { height:100%; border-radius:8px; background:#5d9aee; transition:width .4s}
.bar-row .num { width:30px; text-align:right; font-variant-numeric:tabular-nums}
.controls { display:flex; flex-wrap:wrap; gap:10px}
button { background:var(--blue); color:white; border:0; border-radius:9px; padding:11px 14px; font-size:12px; font-weight:600; min-height:44px}
button.ghost { background:white; border:1px solid var(--line); color:#42546e}
button.ghost:hover { background:#f4f8ff; border-color:#bed4f2}
#resetBtn { color:var(--red)}
.table-wrap { overflow-x:auto}
table { width:100%; border-collapse:collapse; font-size:12px; line-height:1.7}
th,td { text-align:left; padding:14px 12px; border-bottom:1px solid #edf1f6}
th { color:var(--muted); font-size:11px; font-weight:500; background:#f8fafc}
td:first-child { width:52%; min-width:160px; overflow-wrap:anywhere}
td:not(:first-child) { white-space:nowrap}
tbody tr:last-child td { border-bottom:0}
.page-note { margin-top:24px; text-align:center}
@media(max-width:768px) { body { padding:20px 16px 32px}
.overview { display:block}
.devline { display:inline-block; margin-top:16px}
.kpis { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.grid2 { grid-template-columns:1fr; gap:16px}
.panel { padding:18px}
.kpi { padding:18px}
.kpi .v { font-size:29px}
.topbar { margin-bottom:24px}
h1 { font-size:25px}
.table-wrap { margin:0 -6px}
}

</style>
</head>
<body>
  <header class="topbar"><div class="brand">龙虾脑 <span style="color:var(--muted);font-weight:400"> / 运营看板</span></div><a href="/">返回控制页 ↗</a></header>
  <main><section class="overview"><div><div class="eyebrow">WORKSPACE OVERVIEW</div><h1>电脑任务，一目了然。</h1><p class="sub">查看任务表现与设备状态，掌握每一次执行。</p></div>

  <div class="devline">
    <span class="dot" id="devDot"></span><span id="devText">设备状态加载中…</span>
  </div>

  </section>
  <div class="kpis">
    <div class="kpi"><div class="v" id="kTotal">-</div><div class="k">任务总数</div></div>
    <div class="kpi"><div class="v" id="kRate">-</div><div class="k">成功率</div></div>
    <div class="kpi"><div class="v" id="kAvg">-</div><div class="k">平均耗时(s)</div></div>
    <div class="kpi"><div class="v" id="kRunning">-</div><div class="k">执行中</div></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>意图分布</h2>
      <div id="bars"></div>
    </div>
    <div class="panel">
      <h2>设备控制</h2>
      <div class="controls">
        <button id="offlineBtn" class="ghost">切换设备离线</button>
        <button id="resetBtn" class="ghost">重置任务记录</button>
      </div>
      <p class="sub" style="margin-top:12px">「设备离线」用于测试"电脑不在线"时的提示。</p>
    </div>
  </div>

  <div class="panel">
    <h2>最近任务</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>指令</th><th>意图</th><th>状态</th><th>耗时</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </div>

  </main><footer class="page-note">龙虾脑 · 数据来自当前设备，自动更新</footer>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => (s == null ? "" : String(s)).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const DIST_LABEL = { search_movie: "电影", join_meeting: "加入会议", create_meeting: "创建会议", unknown: "未识别" };
  const ST_LABEL = { queued: "排队中", dispatched: "已下发", running: "执行中", success: "成功", failed: "失败" };

  async function fetchDashboard() {
    try {
      const d = await (await fetch("/api/dashboard")).json();
      $("#kTotal").textContent = d.total;
      $("#kRate").textContent = d.success_rate == null ? "—" : d.success_rate + "%";
      $("#kAvg").textContent = d.avg_duration == null ? "—" : d.avg_duration;
      $("#kRunning").textContent = d.running;

      const max = Math.max(1, ...Object.values(d.intent_distribution));
      $("#bars").innerHTML = Object.entries(d.intent_distribution).map(([k, v]) => {
        const pct = Math.round(v / max * 100);
        return `<div class="bar-row"><span class="name">${DIST_LABEL[k] || k}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span class="num">${v}</span></div>`;
      }).join("");

      $("#tbody").innerHTML = d.recent_tasks.map((t) => {
        const st = t.status;
        return `<tr><td>${esc(t.command)}</td><td>${esc(t.label)}</td>
          <td><span class="st ${st}">${ST_LABEL[st] || st}</span></td>
          <td>${t.duration != null ? t.duration + "s" : "—"}</td></tr>`;
      }).join("");
    } catch (e) {}
  }

  async function fetchDevice() {
    try {
      const d = await (await fetch("/api/device")).json();
      const on = !!d.online;
      $("#devDot").className = "dot" + (on ? " on" : "");
      $("#devText").textContent = on ? "设备在线（" + d.name + "）" : "设备离线";
    } catch (e) {}
  }

  $("#offlineBtn").addEventListener("click", async () => {
    const d = await (await fetch("/api/device")).json();
    await fetch("/api/device", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ manual_offline: !d.manual_offline }),
    });
    fetchDevice();
  });

  $("#resetBtn").addEventListener("click", async () => {
    await fetch("/api/reset", { method: "POST" });
    fetchDashboard();
  });

  fetchDashboard();
  fetchDevice();
  setInterval(fetchDashboard, 2000);
  setInterval(fetchDevice, 3000);
</script>
</body>
</html>
